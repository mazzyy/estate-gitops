name: sync

# The GitOps half of the loop. A merged pull request — including one opened by
# Warden's Remediator — reaches the cluster here and nowhere else.
#
# This is what makes "the agent's only write primitive is a pull request" a
# complete story rather than half of one: the agent proposes, a human approves,
# and this workflow is the only thing in the system holding a credential that
# can change the estate.
#
# That sentence was here before the credential was. The workflow had never run;
# a human was applying by hand. Worse, it asked for an AZURE_CREDENTIALS
# service principal with Contributor on the resource group — which can delete
# the cluster — to patch one Deployment in one namespace.
#
# It now authenticates as `warden-sync`, a ServiceAccount scoped to the `demo`
# namespace that cannot delete anything (rbac/warden-sync.yaml), and
# scripts/verify-sync-rbac.sh proves that against the live API server rather
# than asserting it here.
#
# Required repository secrets:
#   KUBE_APISERVER  cluster API server URL
#   KUBE_TOKEN      warden-sync ServiceAccount token
#   KUBE_CA         cluster CA certificate (PEM) — not a secret, but a variable
#                   this size is unwieldy, so it lives alongside the others
#
# All three come from ./scripts/ci-credentials.sh.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "namespace.yaml"
      # rbac/** is deliberately absent. A merged pull request must not be able
      # to widen the permissions of the identity applying it — including its
      # own. RBAC changes are applied by an operator, by hand, on purpose.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second merge landing mid-rollout would race the first one's `rollout
  # status` and report the wrong result. Queue instead, never cancel: a
  # cancelled apply leaves the cluster half-updated with nothing watching it.
  group: sync-cluster
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests
        run: |
          python3 -c "
          import glob, yaml, sys
          for path in glob.glob('apps/**/*.yaml', recursive=True) + ['namespace.yaml']:
              if path.endswith('kustomization.yaml'): continue
              with open(path) as fh:
                  list(yaml.safe_load_all(fh))
              print('ok', path)
          "

      - name: Configure cluster access
        env:
          KUBE_APISERVER: ${{ secrets.KUBE_APISERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA: ${{ secrets.KUBE_CA }}
        run: |
          if [ -z "$KUBE_TOKEN" ]; then
            echo "::error::KUBE_TOKEN is not set. This workflow cannot apply anything."
            echo "::error::Run ./scripts/ci-credentials.sh and add the three repository secrets."
            exit 1
          fi
          printf '%s' "$KUBE_CA" > "$RUNNER_TEMP/cluster-ca.crt"
          kubectl config set-cluster warden \
            --server="$KUBE_APISERVER" \
            --certificate-authority="$RUNNER_TEMP/cluster-ca.crt" \
            --embed-certs=true
          kubectl config set-credentials warden-sync --token="$KUBE_TOKEN"
          kubectl config set-context warden \
            --cluster=warden --user=warden-sync --namespace=demo
          kubectl config use-context warden

      - name: Confirm the applier is scoped
        run: |
          # Fail before touching the cluster if this credential is broader than
          # the design claims. A CI job that can delete a namespace is not a
          # GitOps sync, whatever the file is called.
          for pair in "delete/deployments" "get/secrets" "create/clusterrolebindings"; do
            verb="${pair%%/*}"; res="${pair##*/}"
            if [ "$(kubectl auth can-i "$verb" "$res" 2>/dev/null)" = "yes" ]; then
              echo "::error::sync credential can $verb $res — refusing to run"
              exit 1
            fi
          done
          echo "applier: $(kubectl auth whoami -o jsonpath='{.status.userInfo.username}')"

      - name: Apply
        run: |
          # Explicit files, not `-f apps/checkout-svc/`. That directory
          # contains kustomization.yaml, which `apply -f` on a directory tries
          # to parse as a manifest and fails on.
          #
          # namespace.yaml is not applied here either: creating namespaces is
          # cluster-scoped, and this credential is deliberately namespaced.
          kubectl apply \
            -f apps/checkout-svc/deployment.yaml \
            -f apps/checkout-svc/service.yaml
          kubectl annotate deployment/checkout-svc \
            "kubernetes.io/change-cause=${{ github.event.head_commit.message }}" --overwrite

      - name: Wait for rollout
        run: kubectl rollout status deployment/checkout-svc --timeout=180s

      - name: Report what the cluster looks like now
        if: always()
        run: |
          # Runs even on failure. A blocked rollout is the interesting case and
          # the logs of the crashing pod are what a reviewer needs to see.
          kubectl get pods -o wide || true
          kubectl describe deployment/checkout-svc | tail -20 || true
